name: Android Debug Artifact

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YOLO export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics tensorflow

      - name: Download official YOLO11n PT
        run: |
          wget -O yolo11n.pt https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt

      - name: Export YOLO11n to TFLite
        run: |
          yolo export model=yolo11n.pt format=tflite

      - name: Embed YOLO11n TFLite model into Android assets
        run: |
          mkdir -p app/src/main/assets
          model_file="$(find . -path './app/*' -prune -o -name '*.tflite' -print | sort | head -n 1)"
          if [ -z "$model_file" ]; then
            echo "No TFLite model was generated" >&2
            exit 1
          fi
          cp "$model_file" app/src/main/assets/yolo11n.tflite
          sha256sum app/src/main/assets/yolo11n.tflite | tee app/src/main/assets/yolo11n.tflite.sha256

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload embedded YOLO model metadata
        uses: actions/upload-artifact@v4
        with:
          name: embedded-yolo11n-tflite
          path: |
            app/src/main/assets/yolo11n.tflite
            app/src/main/assets/yolo11n.tflite.sha256

      - name: Update README with latest artifact link
        if: github.actor != 'github-actions[bot]'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execFileSync } = require('node:child_process');

            const marker = '<!-- AUTO-APK-LINK -->';
            const newLine = `${marker} [Latest Debug APK](${process.env.ARTIFACT_URL})`;
            const path = 'README.md';
            const branch = context.ref.replace('refs/heads/', '');

            const git = (args) => execFileSync('git', args, { stdio: 'inherit' });
            const updateReadme = () => {
              const content = fs.readFileSync(path, 'utf8');
              const regex = new RegExp(`${marker}.*`);
              const updated = regex.test(content)
                ? content.replace(regex, newLine)
                : `${content.trimEnd()}\n\n## Download\n${newLine}\n`;

              if (updated === content) {
                core.info('README already up to date.');
                return false;
              }

              fs.writeFileSync(path, updated);
              return true;
            };

            git(['config', 'user.name', 'github-actions[bot]']);
            git(['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            git(['fetch', 'origin', branch]);
            git(['pull', '--rebase', 'origin', branch]);

            if (!updateReadme()) {
              return;
            }

            git(['add', path]);
            git(['commit', '-m', 'ci: update latest debug artifact link']);
            git(['pull', '--rebase', 'origin', branch]);
            git(['push', 'origin', `HEAD:${branch}`]);
