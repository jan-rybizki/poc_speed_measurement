name: Android Debug Artifact

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download Task Vision compatible EfficientDet Lite0 model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          model_file="app/src/main/assets/efficientdet-lite0.tflite"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$model_file" \
            'https://tfhub.dev/tensorflow/lite-model/efficientdet/lite0/detection/metadata/1?lite-format=tflite'
          if [ ! -s "$model_file" ] || [ "$(wc -c < "$model_file")" -lt 1000000 ]; then
            echo "Downloaded model is missing or unexpectedly small" >&2
            exit 1
          fi
          # A FlatBuffer starts with a root offset followed by the TFLite identifier.
          test "$(od -An -j4 -N4 -tc "$model_file" | tr -d ' ')" = 'TFL3'
          sha256sum "$model_file" | tee "$model_file.sha256"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload embedded model metadata
        uses: actions/upload-artifact@v4
        with:
          name: embedded-efficientdet-lite0
          path: |
            app/src/main/assets/efficientdet-lite0.tflite
            app/src/main/assets/efficientdet-lite0.tflite.sha256
